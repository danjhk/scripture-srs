<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<title>개역한글 암송 게임</title>
<link rel="stylesheet" href="wake-up.css?v=4" />
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569;
    --border: #cbd5e1; --accent: #0f766e; --selected: #ecfdf5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #020617; --card: #0f172a; --text: #f1f5f9; --muted: #cbd5e1;
      --border: #475569; --accent: #5eead4; --selected: #134e4a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  main { max-width: 580px; margin: 0 auto; padding: 20px 16px 28px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; line-height: 1.25; }
  .game-setup { padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); }
  fieldset { min-width: 0; margin: 0 0 16px; padding: 0; border: 0; }
  legend { margin-bottom: 8px; padding: 0; font-weight: 700; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--selected); }
  .choice input, .select-all input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
  .select-all { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
  .tms-choices { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tms-choices .choice { justify-content: center; gap: 4px; padding: 6px 3px; }
  @media (min-width: 420px) {
    .dep-choices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .setup-button {
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  #startGame { width: 100%; border-color: #0f766e; background: #0f766e; color: #fff; font-weight: 700; }
  #startGame:disabled { border-color: var(--border); background: var(--bg); color: var(--muted); cursor: default; }
  #setupStatus { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  footer { margin-top: 20px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>개역한글 암송 게임</h1>
    <button id="backToSetup" type="button" class="setup-button" hidden>게임 설정</button>
  </header>

  <form id="gameSetup" class="game-setup">
    <fieldset>
      <legend>암송할 팩</legend>
      <div class="choices">
        <label class="choice"><input type="checkbox" name="group" value="5확신" checked />5확신</label>
        <label class="choice"><input type="checkbox" name="group" value="8동행" checked />8동행</label>
      </div>
    </fieldset>

    <fieldset data-pack-group="60구절">
      <legend><label class="select-all"><input type="checkbox" data-select-all checked />60구절 전체 선택</label></legend>
      <div class="choices tms-choices">
        <label class="choice"><input type="checkbox" name="group" value="60구절 A" checked />A</label>
        <label class="choice"><input type="checkbox" name="group" value="60구절 B" checked />B</label>
        <label class="choice"><input type="checkbox" name="group" value="60구절 C" checked />C</label>
        <label class="choice"><input type="checkbox" name="group" value="60구절 D" checked />D</label>
        <label class="choice"><input type="checkbox" name="group" value="60구절 E" checked />E</label>
      </div>
    </fieldset>

    <fieldset data-pack-group="242">
      <legend><label class="select-all"><input type="checkbox" data-select-all checked />242 전체 선택</label></legend>
      <div class="choices dep-choices">
        <label class="choice"><input type="checkbox" name="group" value="DEP1" checked />DEP1</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP2" checked />DEP2</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP3" checked />DEP3</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP4" checked />DEP4</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP5" checked />DEP5</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP6" checked />DEP6</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP7" checked />DEP7</label>
        <label class="choice"><input type="checkbox" name="group" value="DEP8" checked />DEP8</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>문제 유형</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="target" value="text" checked />본문</label>
        <label class="choice"><input type="radio" name="target" value="title" />제목</label>
      </div>
    </fieldset>

    <fieldset id="depTitleOptions" hidden>
      <legend>DEP2–7에서 외울 항목</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="depTitle" value="heading" checked />제목</label>
        <label class="choice"><input type="radio" name="depTitle" value="subtitle" />소제목</label>
      </div>
    </fieldset>

    <p id="setupStatus" role="status">구절을 불러오는 중…</p>
    <button id="startGame" type="submit" class="setup-button" disabled>게임 시작</button>
  </form>

  <div id="krvWakeUpBattle" hidden></div>
  <footer id="credit"></footer>
</main>

<script src="wake-up.js?v=4"></script>
<script src="wake-up-battle.js?v=4"></script>
<script>
"use strict";
const setup = document.getElementById("gameSetup");
const start = document.getElementById("startGame");
const back = document.getElementById("backToSetup");
const battle = document.getElementById("krvWakeUpBattle");
const setupStatus = document.getElementById("setupStatus");
const depTitleOptions = document.getElementById("depTitleOptions");
const packGroups = Array.from(setup.querySelectorAll("[data-pack-group]"), (group) => ({
  all: group.querySelector("[data-select-all]"),
  parts: [...group.querySelectorAll('[name="group"]')],
}));
const settingsKey = "krv-wake-up-settings";
let packs;
let stopBattle;

function readSettings() {
  const form = new FormData(setup);
  return { groups: form.getAll("group"), answerSource: form.get("target"), depTitleSource: form.get("depTitle") };
}

function restoreSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    if (Array.isArray(saved?.groups)) {
      for (const input of setup.querySelectorAll('[name="group"]')) {
        const parent = input.closest("[data-pack-group]")?.dataset.packGroup;
        input.checked = saved.groups.includes(input.value) || saved.groups.includes(parent);
      }
    }
    if (saved?.answerSource === "title") setup.querySelector('[name="target"][value="title"]').checked = true;
    const oldTitleMode = saved?.answerSource === "title" && !saved.depTitleSource;
    if (saved?.depTitleSource === "subtitle" || oldTitleMode) {
      setup.querySelector('[name="depTitle"][value="subtitle"]').checked = true;
    }
  } catch {}
}

function showStatus(message) {
  setupStatus.textContent = message;
  setupStatus.hidden = !message;
}

function updateSetup() {
  for (const { all, parts } of packGroups) {
    const selected = parts.filter((part) => part.checked).length;
    all.checked = selected === parts.length;
    all.indeterminate = selected > 0 && selected < parts.length;
  }
  const settings = readSettings();
  depTitleOptions.hidden = settings.answerSource !== "title" || !settings.groups.some((pack) => /^DEP[2-7]$/.test(pack));
  if (!packs) return;
  start.disabled = settings.groups.length === 0;
  showStatus(start.disabled ? "한 개 이상의 팩을 선택하세요." : "");
}

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

restoreSettings();
updateSetup();
setup.addEventListener("change", (event) => {
  const selectedGroup = packGroups.find(({ all }) => all === event.target);
  if (selectedGroup) {
    for (const part of selectedGroup.parts) part.checked = selectedGroup.all.checked;
  }
  try { localStorage.setItem(settingsKey, JSON.stringify(readSettings())); } catch {}
  updateSetup();
});
setup.addEventListener("submit", (event) => {
  event.preventDefault();
  const settings = readSettings();
  if (!packs || settings.groups.length === 0) return;
  const deck = WakeUp.makeKoreanDeck(packs, settings);
  if (deck.length === 0) {
    showStatus("선택한 팩에 연습할 구절이 없어요.");
    return;
  }
  setup.hidden = true;
  battle.hidden = false;
  back.hidden = false;
  stopBattle = WakeUpBattleUI.mount(battle, shuffle(deck), "ko", settings.answerSource);
});
back.addEventListener("click", () => {
  stopBattle?.();
  stopBattle = null;
  battle.hidden = true;
  back.hidden = true;
  setup.hidden = false;
  start.focus();
});

fetch("krv/verses.json")
  .then((response) => {
    if (!response.ok) throw new Error(response.status);
    return response.json();
  })
  .then((data) => {
    if (!Array.isArray(data.packs) || !window.WakeUp?.makeKoreanDeck || !window.WakeUpBattleUI?.mount) {
      throw new Error("Game data unavailable");
    }
    packs = data.packs;
    document.getElementById("credit").textContent = `본문: ${data.source}`;
    updateSetup();
  })
  .catch(() => showStatus("게임을 불러오지 못했어요. 페이지를 새로 고침해 주세요."));
</script>
</body>
</html>
